<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eden View Boutique Hotel: your Google listing today</title>
<link rel="icon" href="reviewtap-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  The one renderer for every "Your Google listing today" page (ReviewTap branding, tokens from D:\Reviewtap\design-system.html).
  Two ways it gets its data:
    1. build.py writes one file per hitlist prospect with the data in <script id="pdata">.
    2. Published bare as page-3e9c41.html, it reads ?d=<base64url JSON> from the link that
       Giorgio's check tool makes ("Make their page"). No rebuild needed.
  reviewtap-mark.png must sit next to the pages.
-->
<style>
:root{--orange:#FFA04C;--orange-d:#E8822A;--orange-10:#FFF4E8;--green:#05C347;--green-10:#EDFAF3;--blue:#1752D0;--blue-10:#EEF2FF;--black:#111;--g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g400:#9CA3AF;--g600:#4B5563;--g800:#1F2937;--gold:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--g50);color:var(--g800);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.brand{background:#fff;border-bottom:1px solid var(--g200)}
.brand .wrap{display:flex;align-items:center;gap:10px;height:64px}
.brand img{height:36px;width:auto}
.wm{font-weight:800;font-size:20px;letter-spacing:-.02em}.wm .r{color:var(--orange)}.wm .t{color:var(--black)}
.brand .tag{margin-left:auto;font-size:12.5px;color:var(--g600)}
.hero{background:var(--black);color:#fff;padding:clamp(34px,6vw,64px) 0 96px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,160,76,.38),rgba(255,160,76,0) 70%)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
.hero h1{font-size:clamp(34px,6.5vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:12px 0 10px;position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.75);font-size:clamp(15px,1.8vw,18px);max-width:58ch;position:relative;z-index:1}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-64px;position:relative;z-index:2}
.st{background:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:0 8px 32px rgba(0,0,0,.10)}
.sv{font-size:clamp(30px,4.5vw,40px);font-weight:800;letter-spacing:-.03em;color:var(--black);line-height:1}
.sl{font-size:13px;color:var(--g600);margin-top:6px;line-height:1.35}
.stars{position:relative;display:inline-block;color:var(--g200);font-size:16px;letter-spacing:2px;margin-top:6px}
.stars span{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold)}
main{padding:28px 0 20px}
.card{display:grid;grid-template-columns:48px 1fr;gap:18px;background:#fff;border-radius:20px;padding:clamp(20px,3.4vw,30px);margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--g200)}
.ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.bad .ic{background:var(--orange-10);color:var(--orange-d)}.good .ic,.next .ic{background:var(--green-10);color:var(--green)}
.why .ic{background:#fff;color:var(--blue)}
.lab{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.bad .lab{color:var(--orange-d)}.good .lab,.next .lab{color:var(--green)}.why .lab{color:var(--blue)}
.card.why{background:var(--blue-10);border-color:#dbe3fb}
.card.next{border:2px solid var(--green)}
.card h2{font-size:clamp(21px,2.8vw,27px);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--black);margin-bottom:8px}
.card p{font-size:16px;color:var(--g600);max-width:64ch}
.card b{color:var(--black);font-weight:700}
.fine{font-size:12.5px!important;color:var(--g400)!important;margin-top:12px}
.bars{margin-top:18px;display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(100px,190px) 1fr 60px;gap:12px;align-items:center;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g600)}
.bt{background:var(--g100);border-radius:999px;height:16px;overflow:hidden}
.bf{height:100%;border-radius:999px}
.you .bf,.now .bf{background:var(--orange)}.them .bf{background:var(--blue)}.proj .bf{background:var(--green)}
.you .bl,.proj .bl{color:var(--black);font-weight:700}
.bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--black)}
.close{background:var(--black);color:#fff;border-radius:20px;padding:clamp(24px,4vw,36px);margin:8px 0 18px;display:flex;gap:20px;align-items:center}
.close img{height:56px;width:auto;flex:none}
.close h3{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.close h3 span{color:var(--orange)}
.close p{color:rgba(255,255,255,.7);font-size:15px;margin-top:6px}
footer{padding:0 16px 40px;font-size:12.5px;color:var(--g400)}
.empty{padding:80px 16px;text-align:center;color:var(--g600)}
@media (max-width:560px){.card{grid-template-columns:1fr;gap:10px}.bar{grid-template-columns:1fr 52px}.bl{grid-column:1/-1}.brand .tag{display:none}.close{flex-direction:column;align-items:flex-start}}
@media print{.hero,.close,.bf{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}
</style></head><body>
<div class="brand"><div class="wrap"><img src="reviewtap-mark.png" alt=""><div class="wm"><span class="r">Review</span><span class="t">Tap</span></div><div class="tag">Google reviews for guesthouses</div></div></div>
<div id="page"><div class="empty">This page link is incomplete. Ask the person who sent it for a fresh link.</div></div>
<script type="application/json" id="pdata">{"name": "Eden View Boutique Hotel", "town": "Hoekwil", "region": "Garden Route", "rooms": "19", "rating": "5", "count": "11", "given": "", "comp": "AfriCamps at Oakhurst", "compc": "218", "own": "2871", "low": "2898", "site": "Wego", "checked": "1 Nov 2026", "prices": "2 to 3 Nov, 2 guests", "by": "Giorgio van Rooyen"}</script>
<script>
(function () {
  // Reviews a guesthouse gets per room per month when every checkout is asked (same basis as the Sprint guarantee).
  var PER_ROOM_LOW = 1.0, PER_ROOM_HIGH = 1.8, NEW_REVIEW_AVG = 4.8, UNDERCUT_MIN = 5;

  var D = null, el = document.getElementById('pdata');
  try {
    if (el) D = JSON.parse(el.textContent);
    else {
      var d = new URLSearchParams(location.search).get('d');
      if (d) D = JSON.parse(decodeURIComponent(escape(atob(d.replace(/-/g, '+').replace(/_/g, '/')))));
    }
  } catch (e) { D = null; }
  if (!D || !D.name) return;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n(v) { if (v === null || v === undefined || v === '') return null; var x = parseFloat(String(v).replace(/[R,\s]/g, '')); return isNaN(x) ? null : x; }
  function f0(v) { return Math.round(v).toLocaleString('en-US'); }
  function f1(v) { return (Math.round(v * 10) / 10).toFixed(1); }
  function rand(v) { return 'R' + f0(v); }
  function fmtDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
    if (!m) return s || '';
    return (+m[3]) + ' ' + 'January February March April May June July August September October November December'.split(' ')[+m[2] - 1] + ' ' + m[1];
  }

  var name = D.name, town = D.town || '', rating = n(D.rating), count = n(D.count), rooms = n(D.rooms);
  var comp = (D.comp || '').trim(), compN = n(D.compc), near = 'nearby';
  var tops = (D.tops || []).map(function (t) { return [String(t[0] || '').trim(), n(t[1]), n(t[2])]; }).filter(function (t) { return t[0]; });
  var p1 = n(D.p1), p2 = n(D.p2), live = !!p1, checked = fmtDate(D.checked);

  // A live check beats the sheet: the rival is the first place in the same search that isn't them.
  var lname = name.toLowerCase();
  for (var i = 0; i < tops.length; i++) {
    var tn = tops[i][0].toLowerCase();
    if (tops[i][2] && tn.indexOf(lname) < 0 && lname.indexOf(tn) < 0) { comp = tops[i][0]; compN = tops[i][2]; near = 'in the same search'; break; }
  }

  function bar(label, value, top, cls) {
    var w = !top ? 100 : Math.max(4, Math.round(value / top * 100));
    return '<div class="bar ' + cls + '"><div class="bl">' + esc(label) + '</div><div class="bt"><div class="bf" style="width:' + w + '%"></div></div><div class="bv">' + f0(value) + '</div></div>';
  }
  function toNextTenth() {
    // At 4.9 the next step is 5.0, which a real guesthouse rarely holds: don't promise it.
    if (rating === null || rating >= 4.85) return null;
    var g = n(D.given);
    if (g !== null) return [Math.round(g), false];
    if (!count) return null;
    var target = Math.round((rating + 0.05) * 100) / 100;
    if (target >= 5) return null;
    return [Math.ceil((target - rating) * count / (5 - target)), true];
  }

  var secs = [];

  // 0. Where they come up (live check only)
  if (live) {
    var pos = function (p) { return p >= 99 ? 'outside the top 20' : '<b>#' + p + '</b>'; };
    var t, cls;
    if (p1 <= 3) { t = 'Guests find you. The question is whether they pick you.'; cls = 'good'; }
    else if (p1 <= 10) { t = 'You come up #' + p1 + ' when guests search ' + esc(town); cls = 'bad'; }
    else { t = 'Most guests searching your town never reach you'; cls = 'bad'; }
    var b = 'When a guest searches <b>"guest houses in ' + esc(town) + '"</b> on Google Maps, ' + esc(name) + ' comes up ' + pos(p1) + ' (not counting adverts).';
    if (p2) b += ' For <b>"accommodation in ' + esc(town) + '"</b> it\'s ' + pos(p2) + '.';
    if (tops.length) b += ' The top of that search: ' + tops.map(function (x) {
      return esc(x[0]) + (x[2] ? ' (' + f0(x[2]) + ' reviews' + (x[1] ? ' at ' + f1(x[1]) : '') + ')' : '');
    }).join('; ') + '.';
    if (rating !== null && rating < 4.5) b += '<br><br>Google Maps lets guests filter places to stay by guest rating. At ' + f1(rating) + ', you disappear for anyone who taps <b>' + (rating < 4.0 ? '4.0+ or 4.5+' : '4.5+') + '</b>.';
    var nw = (D.newest || '').trim();
    if (['3 to 12 months ago', 'Over a year ago', 'No Google reviews'].indexOf(nw) >= 0) b += '<br><br>Your newest Google review is <b>' + esc(nw.toLowerCase()) + '</b>. 74% of people look for reviews written in the last 3 months.';
    secs.push([cls, t, b, '<p class="fine">Checked live on ' + esc(checked) + ', not counting adverts. A guest searching from inside the town can see a slightly different order.</p>']);
  }

  // 1. Reviews next to the place down the road
  if (rating === null || count === null) {
    secs.push(['bad', 'Your place has no Google listing of its own', 'We could not find a Google listing that is clearly yours. Guests searching for you find other places first, and any reviews you do have are not adding up in one place.', '']);
  } else {
    var need = toNextTenth();
    var body = 'You have <b>' + f0(count) + ' Google reviews</b> at <b>' + f1(rating) + '</b>.';
    if (need && need[0]) body += ' ' + (need[1] ? 'About ' : '') + need[0] + ' more five-star review' + (need[0] !== 1 ? 's' : '') + ' would take you to <b>' + f1(rating + 0.1) + '</b>.';
    var chart = '', title;
    if (comp && compN) {
      var top = Math.max(count, compN);
      chart = '<div class="bars">' + bar(name, count, top, 'you') + bar(comp, compN, top, 'them') + '</div>';
      title = count && compN >= 2 * count ? esc(comp) + ' has ' + Math.round(compN / count) + 'x your reviews' : 'Next to ' + esc(comp);
      body += ' <b>' + esc(comp) + '</b>, ' + near + ', has <b>' + f0(compN) + '</b>.';
    } else title = 'Your reviews today';
    secs.push([(compN && count && compN >= 2 * count) || count < 100 ? 'bad' : 'good', title, body, chart]);
    // Google's wording is quoted from its own help page. The survey figures are international: never call them South African.
    secs.push(['why', 'Why this decides your bookings',
      '<b>Found:</b> Google ranks local results on relevance, distance and popularity, and says "more reviews and positive ratings can help your business\'s local ranking." Distance you can\'t change. Reviews you can grow every week.<br><br>' +
      '<b>Picked:</b> 68% of people want at least a 4-star rating, and 74% look for reviews written in the last 3 months.<br><br>' +
      '<b>Booked direct:</b> a guest who doesn\'t find you, or isn\'t convinced, often books you through a booking site instead, and that booking pays commission.',
      '<p class="fine">Sources: Google Business Profile Help, "Tips to improve your local ranking on Google". BrightLocal Local Consumer Review Survey 2026 (international survey).</p>']);
  }

  // 2. What a guest sees when they check prices. A live check's answer beats the sheet's.
  var own = n(D.own), low = n(D.low), site = (D.site || '').trim() || 'a booking site', pc = (D.price || '').trim(), cheap = (D.cheap || '').trim();
  var price = null;
  if (D.noprice) price = null;
  else if (pc === 'none') price = ['bad', 'No prices or booking option show', 'A guest who finds you on Google sees no price and no way to book from your listing, so they go looking somewhere else.'];
  else if (pc === 'ota') price = ['bad', 'Every price option sends the guest to a booking site', 'When a guest checks prices on your Google listing, there is no way to book with you direct.' + (cheap ? ' The cheapest price they see is <b>' + esc(cheap) + '</b>, and that booking pays commission.' : ' Every one of those bookings pays commission.')];
  else if (pc === 'own' && !(own && low)) price = ['good', 'Your own price shows on Google', 'A guest sees your own price on your listing' + (own ? ', <b>' + rand(own) + '</b>' : '') + '.'];
  else if (own === null && low) price = ['bad', 'Every price option sends the guest to a booking site', 'When a guest checks prices on your Google listing, there is no way to book with you direct. The cheapest price they see is <b>' + rand(low) + ' on ' + esc(site) + '</b>, and that booking pays commission.'];
  else if (own === null && low === null && !pc) price = ['bad', 'No prices or booking option show', 'A guest who finds you on Google sees no price and no way to book from your listing, so they go looking somewhere else.'];
  else if (own && low) {
    var gap = (own - low) / own * 100;
    price = gap >= UNDERCUT_MIN
      ? ['bad', esc(site) + ' shows you ' + Math.round(gap) + '% cheaper than you do', 'Your own price on Google: <b>' + rand(own) + '</b>. On the same listing, ' + esc(site) + ' offers the same night for <b>' + rand(low) + '</b>. Most guests click the cheaper one, and that booking pays commission.']
      : ['good', 'Your own price shows, and it is the best price', 'Your own price on Google is <b>' + rand(own) + '</b>, against ' + rand(low) + ' on ' + esc(site) + '. A guest who compares has every reason to book with you direct.'];
  } else if (own) price = ['good', 'Your own price shows on Google', 'A guest sees your own price, <b>' + rand(own) + '</b>, on your listing.'];
  if (price && rating !== null) secs.push(price.concat(['<p class="fine">' + (pc ? 'Prices checked live on ' + esc(checked) : 'Prices checked for one night (' + esc(D.prices || '') + ')') + '. They change daily.</p>']));

  // 3. If every guest was asked
  if (rooms && count !== null) {
    var lo = Math.floor(rooms * PER_ROOM_LOW), hi = Math.ceil(rooms * PER_ROOM_HIGH), k = 2 * lo;
    var nb = 'With ' + Math.round(rooms) + ' rooms, asking every guest the day they check out usually brings in about <b>' + lo + ' to ' + hi + ' new Google reviews a month</b>. Over December and January that is about <b>' + f0(count + k) + ' reviews</b>, up from ' + f0(count) + ' today.';
    if (rating !== null && rating < 4.8) {
      var proj = (rating * count + NEW_REVIEW_AVG * k) / (count + k);
      if (Math.round(proj * 10) > Math.round(rating * 10)) nb += ' Your rating would move from about <b>' + f1(rating) + '</b> to about <b>' + f1(proj) + '</b>.';
    }
    if (comp && compN && compN > count) {
      var months = (compN - count) / ((lo + hi) / 2);
      if (months <= 18) nb += ' At that pace you would pass ' + esc(comp) + ' in about <b>' + Math.ceil(months) + ' months</b>.';
    }
    var tp = Math.max(count + k, compN || 0);
    secs.push(['next', 'If every guest was asked', nb, '<div class="bars">' + bar('Today', count, tp, 'now') + bar('End of January', count + k, tp, 'proj') + (comp && compN ? bar(comp, compN, tp, 'them') : '') + '</div>' +
      '<p class="fine">Based on a guesthouse your size. It depends on how full you are and on guests choosing to leave one.</p>']);
  }

  var icons = { bad: '!', good: '&#10003;', why: '?', next: '&#8599;' };
  var labels = { bad: 'Worth fixing', good: 'Working', why: 'Why it matters', next: 'What could change' };
  var cards = secs.map(function (s) {
    return '<section class="card ' + s[0] + '"><div class="ic">' + icons[s[0]] + '</div><div class="cb"><div class="lab">' + labels[s[0]] + '</div><h2>' + s[1] + '</h2><p>' + s[2] + '</p>' + s[3] + '</div></section>';
  }).join('');

  // Headline numbers for the strip under the hero
  var st = [];
  if (rating !== null) st.push('<div class="st"><div class="sv">' + f1(rating) + '</div><div class="stars"><span style="width:' + Math.round(Math.max(0, Math.min(100, rating / 5 * 100))) + '%">&#9733;&#9733;&#9733;&#9733;&#9733;</span>&#9733;&#9733;&#9733;&#9733;&#9733;</div><div class="sl">Google rating</div></div>');
  if (count !== null) st.push('<div class="st"><div class="sv">' + f0(count) + '</div><div class="sl">Google reviews</div></div>');
  if (live) st.push('<div class="st"><div class="sv">' + (p1 >= 99 ? '20+' : '#' + p1) + '</div><div class="sl">for "guest houses in ' + esc(town) + '"</div></div>');
  if (n(D.y12) !== null) st.push('<div class="st"><div class="sv">' + f0(n(D.y12)) + '</div><div class="sl">new Google reviews in 12 months</div></div>');
  else if (comp && compN) st.push('<div class="st"><div class="sv">' + f0(compN) + '</div><div class="sl">reviews at ' + esc(comp) + '</div></div>');

  var where = esc(town) + (D.region ? ', ' + esc(D.region) : '');
  document.title = name + ': your Google listing today';
  document.getElementById('page').innerHTML =
    '<header class="hero"><div class="wrap"><div class="eyebrow">Your Google listing today</div><h1>' + esc(name) + '</h1>' +
    '<p>' + where + '. What a guest sees when they look for you on Google, checked on ' + esc(checked) + '.</p></div></header>' +
    '<div class="wrap"><div class="strip">' + st.join('') + '</div></div>' +
    '<main class="wrap">' + cards +
    '<section class="close"><img src="reviewtap-mark.png" alt=""><div><h3>Every guest asked. Every review answered. <span>Every WhatsApp replied.</span></h3>' +
    '<p>Prepared for ' + esc(name) + (D.by ? ' by ' + esc(D.by) + ', ReviewTap' : ' by ReviewTap') + '. We\'ll go through this page together on our call.</p></div></section></main>' +
    '<footer class="wrap">Numbers from Google Maps on ' + esc(checked) + '. Review counts and prices change every day.</footer>';
})();
</script>
</body></html>
