[build]
  publish = "."

# ── Security headers applied to every response ──
[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN, not DENY: the Blueprint's WIKI.html review workspace renders
    # each document in an iframe, and DENY made the site refuse to frame its own
    # pages (sidebar loaded, reading pane blank). SAMEORIGIN still blocks every
    # third-party site from embedding these reports, which is the protection that
    # actually matters here. Changed 2026-08-09.
    X-Frame-Options                = "SAMEORIGIN"
    X-Content-Type-Options         = "nosniff"
    X-XSS-Protection               = "1; mode=block"
    Referrer-Policy                = "strict-origin-when-cross-origin"
    Permissions-Policy             = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security      = "max-age=31536000; includeSubDomains; preload"
    X-Robots-Tag                   = "noindex, nofollow, noarchive"
    Content-Security-Policy        = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; object-src 'none'; base-uri 'self';"

# ── Die Veiling Klub app: re-allow the camera for QR scanning at the bar. ──
# The global /* rule above forbids camera for the whole reports site (right for
# reports). This more-specific path wins for the Klub app and re-permits the
# camera for the origin only; everything else in the policy stays locked.
# Without this, getUserMedia throws NotAllowedError on every device with no
# permission prompt, even when the OS/browser camera permission is granted.
[[headers]]
  for = "/die-veiling-m7k4p2/klub/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# ── Web app manifest: serve with the correct JSON manifest type so the Klub
#    card installs cleanly to the home screen (Netlify defaults it to octet). ──
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ── HTML: never cache (always serve fresh) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# ── Images: immutable long-cache ──
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Fonts: immutable long-cache ──
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
