[build]
  publish = "."

# ── Security headers applied to every response ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options                = "DENY"
    X-Content-Type-Options         = "nosniff"
    X-XSS-Protection               = "1; mode=block"
    Referrer-Policy                = "strict-origin-when-cross-origin"
    Permissions-Policy             = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security      = "max-age=31536000; includeSubDomains; preload"
    X-Robots-Tag                   = "noindex, nofollow, noarchive"
    Content-Security-Policy        = "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; object-src 'none'; base-uri 'self';"

# ── HTML: never cache (always serve fresh) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# ── Images: immutable long-cache ──
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Fonts: immutable long-cache ──
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
