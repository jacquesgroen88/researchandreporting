<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ETSC KeyOps · Operations demo</title>
<link rel="icon" href="../assets/key.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="demo-ribbon">Concept demo built for Exclusive Training and Services by JCE Media · sample data only</div>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#/today">
      <img class="key" src="../assets/key.png" alt="">
      <span><b>KeyOps</b><small>Exclusive Training</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="avatar">EB</div>
      <div><b>Elize Botha</b><small>Training administrator</small></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="search"><span>⌕</span><input id="q" placeholder="Search learners, ID numbers, certificates, clients…" autocomplete="off"><kbd>/</kbd></div>
      <div class="top-actions">
        <button class="btn ghost" id="newBtn">+ New booking</button>
        <button class="btn gold" id="tourBtn">▶ Guided tour</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div class="tour" id="tour" hidden>
  <div class="tour-head"><span id="tourStep"></span><button id="tourClose" aria-label="Close tour">✕</button></div>
  <h4 id="tourTitle"></h4>
  <p id="tourText"></p>
  <div class="tour-nav"><button class="btn ghost sm" id="tourPrev">← Back</button><div class="dots" id="tourDots"></div><button class="btn gold sm" id="tourNext">Next →</button></div>
</div>
<div class="toast" id="toast"></div>
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer"></aside>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
