<style>
/* Layout: sticky control bar, then one of three work surfaces (By date / Calendar / By client). Ink-blue neutrals, one cobalt accent, owner colours carry delegation, labels carry category colour. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f4; --line:#dde1e8; --fg:#151a24; --muted:#5d6676; --faint:#8a92a1;
  --accent:#2f5bd3; --accent-soft:#e3eafb; --on-accent:#ffffff;
  --jac:#2f5bd3; --jac-soft:#e3eafb; --dia:#b0457a; --dia-soft:#f8e4ee; --none:#7a8291; --none-soft:#eceef2;
  --bad:#c23b2e; --bad-soft:#fbe6e3; --warn:#a86a06; --warn-soft:#fcf0d9; --ok:#2d7d4f; --ok-soft:#e1f2e8; --ask:#6a3fc1; --ask-soft:#efe8fb;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f131a; --surface:#171c25; --surface-2:#1f2531; --line:#2b3240; --fg:#e7eaf0; --muted:#a2aaba; --faint:#717a8b;
  --accent:#7d9cf0; --accent-soft:#1f2b4a; --on-accent:#0f131a; --jac:#7d9cf0; --jac-soft:#1f2b4a; --dia:#e58ab6; --dia-soft:#3b2030; --none:#8a92a1; --none-soft:#252b36;
  --bad:#f0857a; --bad-soft:#3d1f1c; --warn:#e6b25a; --warn-soft:#3a2d14; --ok:#6fcf97; --ok-soft:#173326; --ask:#b79cf5; --ask-soft:#2a2240; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
.login h1{font-size:22px} .login p{margin:0;color:var(--muted)}
.login input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px;width:100%}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:28px 16px}
header.top h1{font-size:28px;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted)}
.whoami{font-size:12.5px;color:var(--muted);margin-top:6px}
.whoami button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;min-width:92px}
.stat b{display:block;font:600 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button.stat.link{text-align:left;cursor:pointer;border-color:var(--accent)}
button.stat.link span{color:var(--accent)}
.bd-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.bd{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.bd th,.bd td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.bd thead th{border-top:0;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.bd .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.bd td.num.late{color:var(--bad);font-weight:600} .bd td.num.tod{color:var(--fg);font-weight:600} .bd td.num.ask{color:var(--ask);font-weight:600}
.bd tbody tr{cursor:pointer} .bd tbody tr:hover{background:var(--surface-2)}
.bd-name{font-weight:600;white-space:nowrap}
.bd-next{color:var(--muted);min-width:220px}
.bd tfoot td{font-weight:600;background:var(--surface-2)}
.client{scroll-margin-top:70px}
.stat.bad b{color:var(--bad)} .stat.dia b{color:var(--dia)} .stat.ask b{color:var(--ask)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar input[type=search]{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ask{background:var(--ask);border-color:var(--ask);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.check{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}

.notice{margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.empty{margin-top:28px;padding:28px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}

.group{margin-top:22px}
.group h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px}
.group h2 .n{font-family:var(--f-mono);color:var(--faint)}
.group h2 .hint{text-transform:none;letter-spacing:0;font:400 12.5px var(--f-body);color:var(--faint)}
.group.overdue h2{color:var(--bad)} .group.today h2{color:var(--fg)} .group.needs h2{color:var(--ask)} .group.newfor h2{color:var(--dia)}
details.group>summary{cursor:pointer;list-style:none}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary h2::before{content:"▸";font-size:11px} details.group[open]>summary h2::before{content:"▾"}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task.done .t-title{text-decoration:line-through;color:var(--faint)}
.tick{width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;position:relative}
.tick::before{content:"";position:absolute;inset:-10px}
.tick[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-checked="true"]::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.t-main{min-width:0;cursor:pointer}
.t-title{font-weight:500}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;background:var(--surface-2);font-size:11.5px;white-space:nowrap}
.chip.client{background:transparent;border:1px solid var(--line);color:var(--fg)}
.chip.waiting{background:var(--warn-soft);color:var(--warn)}
.chip.doing{background:var(--accent-soft);color:var(--accent)}
.chip.high{background:var(--bad-soft);color:var(--bad)}
.chip.ask{background:var(--ask-soft);color:var(--ask)}
.chip.new{background:var(--dia-soft);color:var(--dia);font-weight:600}
.chip.label{background:color-mix(in srgb,var(--lc) 14%,transparent);color:var(--lc);font-weight:500}
@media (prefers-color-scheme: dark){.chip.label{background:color-mix(in srgb,var(--lc) 26%,transparent);color:color-mix(in srgb,var(--lc) 55%,#fff)}}
.chip.label::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--lc)}
.t-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.due{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.due.late{color:var(--bad)} .due.soon{color:var(--warn)}
.owner{border:0;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center;position:relative}
.owner::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.owner::after{content:"";position:absolute;inset:-8px -4px}
.owner.jacques{background:var(--jac-soft);color:var(--jac)} .owner.diane{background:var(--dia-soft);color:var(--dia)} .owner.unassigned{background:var(--none-soft);color:var(--none)}
.t-detail{grid-column:2 / -1;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.t-ask{grid-column:2 / -1;background:var(--ask-soft);color:var(--ask);border-radius:6px;padding:8px 10px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.t-ask p{margin:0;min-width:0;flex:1 1 100%}
.t-ask .ans{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 8px;font-size:13px}
.t-hand{grid-column:2 / -1;font-size:12.5px;color:var(--dia);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* Calendar */
.cal-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.cal-head h2{font-size:20px}
.cal-nav{display:flex;gap:6px}
.cal-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));min-width:826px}
.cal .dow{padding:6px 8px;font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.day{min-height:116px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);opacity:.6}
.day.weekend{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.day .dn{font:600 12px var(--f-mono);color:var(--muted);display:flex;justify-content:space-between}
.day.today .dn span:first-child{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--oc);background:color-mix(in srgb,var(--oc) 10%,var(--surface));border-radius:4px;padding:2px 5px;font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.ev.jacques{--oc:var(--jac)} .ev.diane{--oc:var(--dia)} .ev.unassigned{--oc:var(--none)}
.ev.waiting{border-left-style:dashed}
.ev.late{color:var(--bad)}
.more{border:0;background:none;color:var(--accent);font-size:11.5px;padding:0;text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.agenda{margin-top:22px}

/* Clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:18px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.c-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.c-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.c-head h3{font-size:17px}
.c-sum{margin:6px 0 0;font-size:12.5px;color:var(--muted)} .c-sum b{font-weight:600;color:var(--fg)} .c-sum .late{color:var(--bad);font-weight:600}
.status{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.status.active{background:var(--ok-soft);color:var(--ok)} .status.onboarding{background:var(--accent-soft);color:var(--accent)}
.status.pipeline{background:var(--surface-2);color:var(--muted)}
.status.winding-down,.status.paused{background:var(--warn-soft);color:var(--warn)} .status.ended{background:var(--none-soft);color:var(--none)}
.c-eng{margin:4px 0 0;color:var(--muted);font-size:13px}
details.facts-wrap{margin-top:8px} details.facts-wrap summary{cursor:pointer;font-size:12px;color:var(--accent)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;margin:8px 0 0;font-size:12.5px}
dl.facts dt{color:var(--faint);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;padding-top:2px}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.c-notes{margin:8px 0 0;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.c-tasks .task{padding:8px 12px}
.c-more{border:0;background:none;color:var(--accent);padding:8px 12px;font-size:12.5px;text-align:left;border-top:1px solid var(--line)}
.c-foot{padding:8px 12px;display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:auto}
.c-foot .muted{font-size:12px;color:var(--faint)}
details.ended-wrap{margin-top:22px} details.ended-wrap summary{cursor:pointer;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog form{padding:18px;display:grid;gap:12px}
dialog h2{font-size:18px}
.field{display:grid;gap:4px} .field>label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field .help{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px}
.label-pick{display:flex;flex-wrap:wrap;gap:6px}
.label-pick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer}
.label-pick input{margin:0;accent-color:var(--lc)}
.label-pick .sw{width:8px;height:8px;border-radius:2px;background:var(--lc)}
.new-label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.new-label input[type=text]{flex:1 1 140px;min-width:0}
.new-label input[type=color]{width:36px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.hist{font-size:12px;color:var(--faint);max-height:120px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.who-btns{display:flex;flex-wrap:wrap;gap:8px}
.who-btns button{flex:1 1 120px;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-weight:600}
.who-btns button[aria-pressed="true"].jacques{background:var(--jac-soft);color:var(--jac);border-color:var(--jac)}
.who-btns button[aria-pressed="true"].diane{background:var(--dia-soft);color:var(--dia);border-color:var(--dia)}
.who-btns button[aria-pressed="true"].unassigned{background:var(--none-soft);color:var(--fg);border-color:var(--none)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:20}
@media (max-width:560px){
  .grid2{grid-template-columns:1fr}.clients{grid-template-columns:1fr}header.top h1{font-size:24px}
  .bar{position:static}
  .stats{flex-wrap:nowrap;overflow-x:auto;width:100%}
  .stat{min-width:84px;flex:0 0 auto}
  .owner{padding:6px 12px 6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- visual layer v2: softer surfaces, clearer hierarchy, avatars, metric tiles ---------- */
:root{--r:10px;--bg:#f2f4f8;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.05)}
@media (prefers-color-scheme: dark){:root{--bg:#0c1016;--shadow:0 1px 2px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.28)}}
body{font-size:14.5px}
.wrap{max-width:1240px}
header.top{align-items:center;padding-block:26px 18px}
header.top h1,.login h1{display:flex;align-items:center;gap:10px}
header.top h1{font-size:26px}
.mark{display:inline-grid;place-items:center;height:32px;padding:0 9px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 12.5px var(--f-display);letter-spacing:.05em}
.stats{gap:10px}
.stat{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:116px;padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);position:relative;transition:transform .12s ease,border-color .12s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{font-size:24px}
.stat::after{content:"";position:absolute;right:12px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--dot,var(--line))}
.stat.cli{--dot:var(--accent)} .stat.open{--dot:var(--ok)} .stat.bad{--dot:var(--bad)} .stat.tod{--dot:var(--warn)} .stat.ask{--dot:var(--ask)} .stat.dia{--dot:var(--dia)}
.stat.zero b{color:var(--faint)} .stat.zero::after{background:var(--line)}
.btn{border-radius:9px} .btn.primary{font-weight:600}
.bar{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:12px;gap:10px}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg button{border-radius:7px;padding:6px 12px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{box-shadow:none}
#viewSeg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#ownerSeg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.bar input[type=search],.bar select{border-radius:10px;padding:8px 11px}

.group{margin-top:28px}
.group h2{font:600 15.5px var(--f-display);letter-spacing:0;text-transform:none;color:var(--fg);margin-bottom:10px}
.group h2 .n{font:600 11.5px var(--f-mono);background:var(--surface-2);color:var(--muted);padding:2px 8px;border-radius:999px}
.group.overdue h2,.group.needs h2,.group.newfor h2{color:var(--fg)}
.group.overdue h2 .n{background:var(--bad-soft);color:var(--bad)} .group.needs h2 .n{background:var(--ask-soft);color:var(--ask)}
.group.newfor h2 .n{background:var(--dia-soft);color:var(--dia)} .group.today h2 .n{background:var(--accent-soft);color:var(--accent)}
.list{border-radius:12px;box-shadow:var(--shadow)}
.task{padding:13px 16px;gap:12px;transition:background .12s ease}
.task:hover{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.t-title{font-weight:600;line-height:1.35}
.t-meta{margin-top:6px}
.chip{border-radius:6px;padding:2px 8px}
.chip.client{border:0;background:var(--surface-2);font-weight:500}
.t-detail{-webkit-line-clamp:1;font-size:12.5px;color:var(--faint)}
.t-side{gap:8px}
.due{font:600 11.5px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.due.late{background:var(--bad-soft);color:var(--bad)} .due.soon{background:var(--warn-soft);color:var(--warn)}
.due.none{background:transparent;color:var(--faint);font-weight:400;padding-inline:0}
.owner{padding:3px 10px 3px 3px;gap:6px}
.owner::before{display:none}
.av{width:20px;height:20px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font:700 10.5px/1 var(--f-body);color:var(--on-accent);background:var(--none)}
.av.jacques{background:var(--jac)} .av.diane{background:var(--dia)} .av.giorgio{background:var(--ok)}
.lead{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.t-ask{border-radius:10px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--ask) 22%,transparent)}
.t-ask p{font-weight:500}

.clients{gap:16px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.client{border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.c-head{padding:16px 16px 14px}
.c-title{min-width:0}
.c-head h3{font-size:18px;line-height:1.25}
.c-full{margin:2px 0 0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-eng{margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.metric{background:var(--surface-2);border-radius:9px;padding:7px 9px;min-width:0}
.metric b{display:block;font:600 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric.bad{background:var(--bad-soft)} .metric.bad b{color:var(--bad)} .metric.ask{background:var(--ask-soft)} .metric.ask b{color:var(--ask)}
.metric.zero b{color:var(--faint)}
.c-sum{margin-top:12px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.c-sum .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{border-radius:999px;padding:3px 10px;font-size:10.5px}
details.facts-wrap{margin-top:10px}
.c-tasks .task{padding:10px 16px}
.c-more{padding:9px 16px}
.c-foot{padding:10px 16px}

.bd-wrap{border-radius:12px;box-shadow:var(--shadow)}

.bd .pill{display:inline-block;min-width:24px;text-align:center;padding:1px 8px;border-radius:999px}
.bd td.num.late .pill{background:var(--bad-soft)} .bd td.num.ask .pill{background:var(--ask-soft)} .bd td.num.tod .pill{background:var(--warn-soft);color:var(--warn)}

.cal-wrap{border-radius:12px;box-shadow:var(--shadow)}
.cal-head h2{font-size:22px}
.day{min-height:124px;padding:8px}
.ev{padding:3px 7px;border-radius:5px;font-size:12px}
.legend{margin-top:10px}

.login{box-shadow:var(--shadow);border-radius:16px;padding:28px;gap:14px}

/* ---------- visual layer v3: greeting, calendar density, editor, sign-in ---------- */
#greet{font-size:14.5px;color:var(--muted);max-width:62ch}
.day.past.empty{min-height:58px}
.day.past .dn{color:var(--faint)}
.day.past:not(.today){background:color-mix(in srgb,var(--surface-2) 30%,var(--surface))}
.day.today{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.ev{box-shadow:0 1px 0 rgba(16,24,40,.04)}
.ev:hover{filter:brightness(.97)}
.cal .dow{padding:9px 10px;font-size:11px}

dialog{width:min(660px,calc(100vw - 32px));padding:0}

.field>label{font-weight:600;letter-spacing:.05em}

#f-title{font:600 16px var(--f-body)}
.label-pick{gap:8px}
.label-pick label.lp{position:relative;white-space:nowrap;padding:5px 12px 5px 10px;border-radius:999px;background:var(--surface);transition:background .12s ease,border-color .12s ease;user-select:none}

.hist{border-radius:10px;background:var(--surface-2);padding:10px 12px;border:0;line-height:1.6}

/* ---------- layout v4: sidebar shell + column list ---------- */
:root{--side:#1f2128;--side-fg:#c9ccd4;--side-mut:#8b909c;--side-hi:#2c2f38;--side-on:#373b46}

.brand{display:flex;align-items:center;gap:10px;font:600 15px var(--f-display);color:#fff;padding:2px 8px 16px}
.nav{display:grid;gap:2px}

.badge.ask{background:var(--ask);color:#fff}
.side-h{margin:18px 10px 6px;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--side-mut)}
.side-labels{display:grid;gap:1px}
.slab{font-size:13px;padding:6px 10px}

.ms-i:focus-visible{outline:2px solid var(--accent)}
.ms-dia{color:var(--ask);font-size:14px}
.ms-dia.sm{font-size:11px}
.ms-t{display:grid;min-width:0} .ms-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ms-t .faint{font-size:12px}
.ms-d{font:600 12px var(--f-mono);color:var(--muted)}
.ms-i.late .ms-d{color:var(--bad)} .ms-i.done{opacity:.6} .ms-i.done .ms-d{color:var(--ok)}
.empty.sm{padding:16px;margin-top:10px;font-size:13px}
.cp-ms-h{margin-top:20px}.cp-ms-h .cp-h{margin:0}
.ev[data-ms="1"]{--oc:var(--ask)!important;font-weight:600}
@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}.dash-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.donut-wrap{grid-template-columns:1fr;justify-items:center}.d-legend{width:100%}.bar-r,.btnlike{grid-template-columns:110px minmax(0,1fr) 30px}}

/* ---------- v7: sidebar clients, rename ---------- */
.side-clients{display:grid;gap:1px;max-height:42vh;overflow:auto;scrollbar-width:thin}
.scl .scl-dot{width:7px;height:7px;border-radius:50%;background:var(--side-mut);flex:none}
.scl .scl-dot.late{background:var(--bad)} .scl .scl-dot.pipe{background:transparent;box-shadow:inset 0 0 0 1.5px var(--side-mut)}
.slab-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pencil{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--muted);font-size:15px;flex:none}
.pencil:hover{background:var(--surface-2);color:var(--accent)}
.pencil:focus-visible{outline:2px solid var(--accent)}
.c-h3{display:flex;align-items:center;gap:4px}
.c-h3 .pencil{width:24px;height:24px;font-size:13px}
.rename-in{font:600 20px var(--f-display);border:1px solid var(--accent);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--fg);box-shadow:0 0 0 3px var(--accent-soft);min-width:0;width:min(520px,100%)}
.rename-in:focus{outline:none}

/* ---------- v8: inbox, mentions, links, files, group/sort, views, week calendar ---------- */
.inbox-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.inbox-head .r{display:flex;gap:8px;margin-top:18px}
.inbox{max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 12px;margin-top:14px}
.inb{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 10px;gap:10px;align-items:start;padding:10px;border-radius:10px;width:100%;box-sizing:border-box}
.inb:hover{background:var(--surface-2)} .inb:focus-visible{outline:2px solid var(--accent)}
.inb .av{width:28px;height:28px}
.inb-b{display:grid;gap:3px;min-width:0}
.inb-t{line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.inb.unread .inb-t{color:var(--fg);font-weight:600}
.inb .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:8px}
.mention{background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:0 4px;font-weight:600}
.mention-pop{display:flex;gap:6px;flex-wrap:wrap;justify-self:start}
.mp-i{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;background:var(--surface)}
.mp-i:hover{border-color:var(--accent)}
.composer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.faint.sm,.sm.faint{font-size:12px}
.pf-block{display:grid;gap:6px}
.att-list{display:grid;gap:4px}
.att{display:grid;grid-template-columns:20px minmax(0,1fr) auto 26px;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.att-n{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.att-n:hover{text-decoration:underline}
.att-x{all:unset;cursor:pointer;text-align:center;color:var(--faint);border-radius:6px;font-size:14px;padding:0 4px;white-space:nowrap}
.att-x:hover{color:var(--bad);background:var(--bad-soft)}
.att-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.att-add input{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg)}
.att-add input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bar-sel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.bar-sel select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font:inherit;font-size:13px;color:var(--fg)}
.view-sum{margin:0;color:var(--muted);font-size:13px}
.side-views{display:grid;gap:1px}
.svw{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.svw-x{all:unset;cursor:pointer;color:var(--side-mut);padding:4px 8px;border-radius:6px;font-size:13px;opacity:.6}
.svw:hover .svw-x{opacity:1} .svw-x:hover{color:#fff;background:var(--side-hi)}
.tog{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tog input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.cal-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cal-mode button{padding:5px 12px}
.cal-mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.wk-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));min-width:1050px;min-height:62vh}
.wk-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.wk-col:last-child{border-right:0}
.wk-col.weekend{background:color-mix(in srgb,var(--surface-2) 40%,var(--surface))}
.wk-col.past{background:color-mix(in srgb,var(--surface-2) 30%,var(--surface))}
.wk-col.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.wk-col.drop{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.wk-h{display:flex;align-items:baseline;gap:8px;padding:10px 10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0}
.wk-dow{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wk-d{font:700 18px var(--f-display)}
.wk-col.today .wk-d{color:var(--accent)}
.wk-n{margin-left:auto;font:600 11px var(--f-mono);color:var(--faint)}
.wk-items{display:flex;flex-direction:column;gap:5px;padding:8px}
.ev.big{white-space:normal;line-height:1.35;padding:6px 8px;font-size:12.5px;display:grid;gap:2px}
.ev-sub{font-size:11px;color:var(--muted);font-weight:400}
.wk-add{all:unset;cursor:pointer;color:var(--faint);font-size:12px;padding:4px 6px;border-radius:6px;opacity:0}
.wk-col:hover .wk-add{opacity:1} .wk-add:hover{color:var(--accent);background:var(--surface-2)} .wk-add:focus-visible{opacity:1;outline:2px solid var(--accent)}
.ev.lifting{opacity:.35}
.drag-ghost{position:fixed;z-index:80;width:150px;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:.95;transform:rotate(-2deg)}
@media (hover:none){.wk-add{opacity:1}}
@media (max-width:860px){.bar-sel{flex:1 1 auto}.bar-sel select{flex:1}}

/* ---------- v9: sidebar fixes for tablets ---------- */
.side>*{flex-shrink:0}
.side .side-clients{max-height:none;overflow:visible}
.side-foot .me-btn span{white-space:nowrap}
.side-foot button{white-space:nowrap}
@media (max-width:860px){
  .side{flex-wrap:wrap;row-gap:8px;overflow:visible}
  .side .nav{flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none}
  .side .side-h,.side .side-labels,.side .side-views{display:none}
  .side .side-clients{display:flex;order:10;flex-basis:100%;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px 0 4px}
  .side .side-clients::-webkit-scrollbar,.side .nav::-webkit-scrollbar{display:none}
  .side .side-clients .scl{width:auto;flex:none;white-space:nowrap;background:var(--side-hi);border-radius:999px;padding:6px 12px;font-size:13px;gap:7px}
  .side .side-clients .scl.on{background:var(--accent);color:#fff}
  .side .side-clients .slab-c{margin-left:2px}
}
</style>

function parseQuick(text,def){

$("#nl-add").onclick=async()=>{
  const name=$("#nl-name").value.trim();if(!name)return;
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  try{await api("create_label",{name,color:$("#nl-color").value})}catch(e){toast("Couldn't add label: "+e.message);return}
  S.labels.set(id,{id,name,color:$("#nl-color").value,sort_order:99});pickedLabels.add(id);$("#nl-name").value="";paintLabelPick();renderLabelFilter();toast("Label added");
};
$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const val={};for(const k in F){let v=$(F[k]).value;v=typeof v==="string"?v.trim():v;val[k]=NULLABLE.has(k)?(v||null):v}
  if(!val.title)return;
  let id=S.editing;
  if(id){
    const prev=S.tasks.get(id);const patch={};
    for(const k in F){if((prev[k]??(NULLABLE.has(k)?null:""))!==val[k])patch[k]=val[k]}
    if(patch.needs&&!prev.prepared_by)patch.prepared_by=prev.owner!=="jacques"?prev.owner:S.me;
    if(patch.owner&&patch.owner!==prev.owner)Object.assign(patch,{handed_by:S.me,handed_at:new Date().toISOString(),ack:patch.owner===S.me});
    if(Object.keys(patch).length&&!(await save(id,patch,"Saved")))return;
  }else{
    const row={...val};
    if(val.owner!==S.me)Object.assign(row,{handed_by:S.me,handed_at:new Date().toISOString(),ack:false});
    if(val.needs)row.prepared_by=S.me==="jacques"?val.owner:S.me;
    try{const data=await api("insert_task",{row,labels:[...pickedLabels]});id=data.id;S.tasks.set(id,data);S.tl.set(id,[...pickedLabels]);toast("Task added")}
    catch(e){toast("Couldn't add: "+e.message);return}
    dlg.close();render();return;
  }
  const before=S.tl.get(id)||[];
  if(before.length!==pickedLabels.size||before.some(l=>!pickedLabels.has(l))){
    try{await api("set_task_labels",{id,labels:[...pickedLabels]});S.tl.set(id,[...pickedLabels])}catch(e){toast("Couldn't save labels: "+e.message)}
  }
  dlg.close();render();
});
$("#del").onclick=async()=>{
  const b=$("#del");
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Click again to delete";setTimeout(()=>{b.dataset.armed="";b.textContent="Delete"},3000);return}
  b.dataset.armed="";b.textContent="Delete";
  try{await api("delete_task",{id:S.editing})}catch(e){toast("Couldn't delete: "+e.message);return}
  S.tasks.delete(S.editing);dlg.close();render();toast("Deleted");
};

// ---- hand over ----
const hand=$("#hand");
function openHand(id){const t=S.tasks.get(id);S.handing=id;S.handTo=t.owner==="diane"?"jacques":"diane";$("#handTitle").textContent=t.title;$("#h-note").value="";paintHand();hand.showModal()}
function paintHand(){document.querySelectorAll("#handWho button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.o===S.handTo)))}
document.querySelectorAll("#handWho button").forEach(b=>b.onclick=()=>{S.handTo=b.dataset.o;paintHand()});
$("#handCancel").onclick=()=>hand.close();
$("#handForm").addEventListener("submit",async e=>{
  e.preventDefault();const t=S.tasks.get(S.handing);
  if(t&&S.handTo!==t.owner)await save(t.id,{owner:S.handTo,handed_by:S.me,handed_at:new Date().toISOString(),handoff_note:$("#h-note").value.trim(),ack:S.handTo===S.me},"Now with "+OWNERS[S.handTo]);
  hand.close();
});

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.nav));
document.querySelectorAll("#ownerSeg button").forEach(b=>b.onclick=()=>{S.owner=b.dataset.o;savePrefs();render()});
$("#labelFilter").addEventListener("change",e=>{S.label=e.target.value;savePrefs();render()});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("#showDone").addEventListener("change",async e=>{S.showDone=e.target.checked;await load();render()});
$("#addTask").onclick=()=>openEdit(null,S.view==="clientpage"?S.clientId:null);
$("#addMs").onclick=()=>openMilestone(S.view==="clientpage"?S.clientId:null);
$("#msForm").addEventListener("submit",createMilestone);$("#msCancel").onclick=()=>$("#msDlg").close();
$("#groupSel").addEventListener("change",e=>{S.group=e.target.value;savePrefs();render()});
$("#sortSel").addEventListener("change",e=>{S.sort=e.target.value;savePrefs();render()});
$("#saveViewBtn").onclick=()=>{const bits=[TITLES[navKey()]||"",S.owner!=="all"&&S.view==="date"?"owner: "+(S.owner==="mine"?"me":OWNERS[S.owner]):"",S.label&&S.labels.get(S.label)?"label: "+S.labels.get(S.label).name:"",S.q?"search: “"+S.q+"”":"","grouped by "+$("#groupSel").selectedOptions[0].text.toLowerCase(),"sorted by "+$("#sortSel").selectedOptions[0].text.toLowerCase()].filter(Boolean);
  $("#viewSum").textContent="Saves: "+bits.join(", ")+".";$("#view-name").value="";$("#viewDlg").showModal()};
$("#viewCancel").onclick=()=>$("#viewDlg").close();
$("#viewForm").addEventListener("submit",async e=>{e.preventDefault();const name=$("#view-name").value.trim();if(!name)return;
  const config={view:S.view==="clientpage"?"date":S.view,owner:S.owner,label:S.label,group:S.group,sort:S.sort,q:S.q,showDone:S.showDone};
  try{const v=await api("save_view",{name,config});S.views.push(v);$("#viewDlg").close();render();toast("View saved")}catch(err){toast("Couldn't save view: "+err.message)}});
$("#setCancel").onclick=()=>$("#setDlg").close();
$("#setPhoto").onclick=()=>{$("#setDlg").close();$("#photoIn").click()};
$("#setForm").addEventListener("submit",async e=>{e.preventDefault();try{const r=await api("notification_settings",{digest:$("#set-digest").checked,alerts:$("#set-alerts").checked});S.people.set(S.me,{...(S.people.get(S.me)||{}),...r});$("#setDlg").close();toast("Email settings saved")}catch(err){toast("Couldn't save: "+err.message)}});
$("#selectBtn").onclick=()=>{S.selectMode=!S.selectMode;S.sel.clear();render();renderBulk()};
function routeHash(){const tm=location.hash.match(/^#task\/(t\d+)$/);if(tm){history.replaceState(null,"",location.pathname);openPanel(tm[1]);return}const m=location.hash.match(/^#client\/(.+)$/);if(m&&S.clients.has(m[1])){openClient(m[1]);return}if(S.view==="clientpage"){S.view="client";render()}}
window.addEventListener("popstate",routeHash);

// ---- data ----
async function load(){
  try{
    const d=await api("snapshot",{include_done:S.showDone});
    S.clients=new Map(d.clients.map(x=>[x.id,x]));S.tasks=new Map(d.tasks.map(x=>[x.id,x]));S.labels=new Map(d.labels.map(x=>[x.id,x]));
    S.tl=new Map();for(const r of d.task_labels){if(!S.tl.has(r.task_id))S.tl.set(r.task_id,[]);S.tl.get(r.task_id).push(r.label_id)}
    S.people=new Map((d.people||[]).map(x=>[x.person,x]));S.cc=d.comment_counts||{};S.fc=d.file_counts||{};S.unread=d.unread||0;S.views=d.views||[];
    note("");return true;
  }catch(e){if(e.auth)throw e;note("Couldn't reach the planner just now. What you see may be out of date.");return false}
}
// Other person's changes arrive by polling: every 30 s while the tab is visible, and on return to the tab.
async function refresh(){const a=document.activeElement;if(document.hidden||dlg.open||hand.open||a?.classList?.contains("ans")||a?.classList?.contains("qa-in")||(S.panel&&panel.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;
  if(await load()){render();if(S.panel){try{const comments=await api("list_comments",{task_id:S.panel});if(S.panelData)S.panelData.comments=comments}catch(e){}renderPanel(true)}}}

function showLogin(msg){$("#loginView").hidden=false;$("#appView").hidden=true;if(msg)$("#loginMsg").textContent=msg}
async function start(){
  if(!KEY)return showLogin();
  try{const w=await api("whoami");S.me=w.person}
  catch(e){try{localStorage.removeItem("jce-planner-key")}catch(_){}KEY=null;return showLogin(e.auth?"That key wasn't accepted. Check it with Jacques.":"Couldn't reach the planner: "+e.message)}
  $("#loginView").hidden=true;$("#appView").hidden=false;
  if(S.view==="history")S.view="reports";
  await load();render();routeHash();if(S.view==="inbox")loadInbox();if(S.view==="reports")loadReports();
  setInterval(refresh,30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
}
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();KEY=$("#email").value.trim();$("#email").value="";
  try{localStorage.setItem("jce-planner-key",KEY)}catch(_){}
  start();
});
start();
})();
</script>
</body>
