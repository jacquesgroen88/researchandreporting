<!doctype html><html lang="af"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Spaar Plan — Splash variasie B</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1c36; --green:#1aa64b; --green2:#13833a; --ice:#8fd0ff; --ink:#eef5ff; --dim:#a6c0e0; --red:#ec1c2b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 600px at 50% -5%,#0e2a4e,transparent),#05101d;color:var(--ink);
  font-family:Inter,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;
  min-height:100dvh;padding:18px 12px 40px}
.lead{max-width:430px;margin:0 auto 14px;text-align:center}
.lead h1{font-family:'Oswald';font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.lead p{color:#6f8bad;font-size:12.5px;margin-top:5px}

.phone{width:392px;max-width:100%;height:812px;margin:0 auto;position:relative;border-radius:46px;background:#000;
  box-shadow:0 40px 90px -30px #000,0 0 0 11px #11161f,0 0 0 13px #273040;overflow:hidden}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:40}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;color:#fff;z-index:30;pointer-events:none}
.statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px;opacity:.9}

.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;
  padding:50px 20px 18px;text-align:center;
  background:linear-gradient(180deg,rgba(5,15,28,.62),rgba(5,15,28,.30) 42%,rgba(5,15,28,.86)),url(img/bg-splash.jpg) center/cover no-repeat;background-color:#05101d}
.splash>*{position:relative;z-index:2;width:100%}
.top,.mid,.bottom{display:flex;flex-direction:column;align-items:center}
.mid{flex:1 1 auto;justify-content:center;min-height:0;gap:0}

.logo{height:66px;width:auto;filter:drop-shadow(0 2px 10px rgba(236,28,43,.55));margin-bottom:6px}
.title{transform:skewX(-6deg);line-height:.86;margin-top:2px}
.title span{display:block;font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.005em;font-size:47px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.title .l1{color:#fff}
.title .l2{color:var(--red);-webkit-text-stroke:.5px rgba(0,0,0,.2)}
.tag{color:var(--ice);font-size:15px;letter-spacing:.01em;margin-top:12px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.9)}

.hero{display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.hero img{max-height:236px;max-width:88%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}

.tiles{width:100%;max-width:360px;margin:-10px auto 0}
.tiles img{width:100%;height:auto;display:block}

.cosponsor{margin-top:8px}
.cosponsor .lbl{display:block;color:#d4edff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.cosponsor img{height:56px;width:auto;filter:drop-shadow(0 2px 14px rgba(47,127,240,.6))}

.cta{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;
  padding:15px;font-family:'Oswald';font-weight:600;font-size:17px;letter-spacing:.02em;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 12px 28px -10px rgba(26,166,75,.85)}
.cta .arw{display:inline-flex;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);align-items:center;justify-content:center;flex:0 0 auto}
.cta .arw svg{display:block;width:16px;height:16px}
.tiny{color:var(--dim);font-size:13px;margin-top:12px;text-shadow:0 1px 8px rgba(0,0,0,.9)}
.tiny b{color:var(--ice)}
</style></head>
<body>

<div class="lead">
  <h1>Die Veiling Spaar Plan — Splash variasie B</h1>
  <p>Selfde teks, nuwe uitleg · bottel-in-ys held + drie-teël strook</p>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span class="r">▮▮▮ &#128246; &#128267;</span></div>

  <section class="splash">
    <div class="top">
      <img class="logo" src="img/dv-logo.png" alt="Die Veiling">
      <div class="title"><span class="l1">Die Veiling</span><span class="l2">Spaar Plan</span></div>
      <div class="tag">Jou kuier begin met 'n plan!</div>
    </div>

    <div class="mid">
      <div class="hero"><img src="img/bottle-ice.png" alt="Castle Lite in ys"></div>
      <div class="tiles"><img src="img/tiles-strip.png" alt="Jou mense · Jou kuierplek · Jou spaarplan"></div>
    </div>

    <div class="bottom">
      <div class="cosponsor"><span class="lbl">Trots geborg deur</span><img src="img/clite-emblem.png" alt="Castle Lite"></div>
      <button class="cta">Begin <span class="arw"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h13M12 6l6 6-6 6"/></svg></span></button>
      <div class="tiny">Reeds 'n lid? <b>Teken in</b></div>
    </div>
  </section>
</div>

</body></html>
